# Render Blueprint: one web service (API + admin hub in one container) and a
# Postgres database. Deploy with New → Blueprint and pick this repository.
# Paid plans, so the service stays awake (background work such as Shopify sync
# keeps running) and the database never expires. Free plans would sleep after
# 15 idle minutes and delete the database 30 days after it's created.
# Plan IDs are Render's compute plans (render.com/docs/blueprint-spec).
services:
  - type: web
    name: ample-pos
    runtime: docker
    # 0.5 CPU, 512 MB: the smallest paid plan ($7/month).
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: ample-pos-db
          property: connectionString
      # Password for the restricted role the API connects as (created on first start).
      - key: APP_DB_PASSWORD
        generateValue: true
      # Built-in accounts (email + password).
      - key: AUTH_MODE
        value: password
      # Encrypts stored Shopify credentials.
      - key: SECRETS_KEY
        generateValue: true
      - key: PAYMENTS_PROVIDER
        value: simulated
      - key: BILLING_PROVIDER
        value: simulated
      # Optional, set in the dashboard when ready:
      # PLATFORM_ADMIN_EMAILS (comma-separated emails of Ample POS staff who may use the super admin dashboard at /platform)
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET (with PAYMENTS_PROVIDER=stripe; the platform account, with Connect enabled)
      # STRIPE_CONNECT_WEBHOOK_SECRET (Connect webhook at /api/webhooks/stripe-connect: businesses' Express accounts)
      # BILLING_STRIPE_SECRET_KEY / BILLING_STRIPE_WEBHOOK_SECRET (with BILLING_PROVIDER=stripe)
      # SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET
      # RESEND_API_KEY / EMAIL_FROM (reset and confirmation emails; without them owners make reset links on the Team page).
      #   Set both: EMAIL_FROM must be an address on a domain verified in Resend, e.g. "Ample POS <no-reply@yourdomain.com>".
      #   Check it from the super admin dashboard: /platform/email.
      # CONTACT_EMAIL (shown on the pricing page for custom website quotes)

databases:
  - name: ample-pos-db
    # 0.1 CPU, 256 MB, 15 GB disk: the smallest paid plan ($6/month). Disk can grow later, not shrink.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: ample_pos
    ipAllowList: []
